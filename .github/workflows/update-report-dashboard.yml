name: Check dashboard data freshness

on:
  push:
    branches: [main]
    paths:
      - 'market-analysis/**'
      - 'supply-zone/**'
      - 'cash-management/**'
      - 'daily-reports/latest.json'
      - 'report_data.json'
      - 'report_signal_data.json'
      - 'etf-weights/latest.json'
      - 'leader-mapping/validation_latest.json'
      - 'news/index.json'
      - 'scripts/audit_dashboard_freshness.py'
      - 'scripts/publication_privacy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published files and ZIP members for local home paths
        run: python scripts/publication_privacy.py --check
      # The legacy fixed-date merger could overwrite newer report history.
      # Inspect only; never replace source dates or mutate published datasets.
      - name: Inspect dates without modifying source data
        run: python scripts/audit_dashboard_freshness.py --output /tmp/dashboard-freshness.json
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-freshness
          path: /tmp/dashboard-freshness.json
