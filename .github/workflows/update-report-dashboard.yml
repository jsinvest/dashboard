name: Update report dashboard

on:
  push:
    branches: [main]
    paths:
      - report_update_20260821.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge report DB and patch dashboard
        run: python scripts/update_report_dashboard.py
      - name: Commit generated dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_data.json report_signal_data.json index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update report dashboard through 2026-08-21"
            git push
          fi
